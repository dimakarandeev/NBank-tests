services:

  backend:
    image: nobugsme/nbank:with_fraud_check
    container_name: nbank-app
    ports:
      - "4111:4111"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nbank
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      FRAUD_DETECTION_SERVICE_URL: http://host.docker.internal:8080
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4111/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  #  frontend:
  #    image: nobugsme/nbank-ui:with_nginx
  #    ports:
  #      - "3000:80"
  #    depends_on:
  #      - backend
  #    networks:
  #      - nbank-network

  postgres:
    image: postgres:15
    container_name: nbank-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=nbank
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    #      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    #    networks:
    #      - nbank-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

